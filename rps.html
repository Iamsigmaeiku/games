<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>剪刀石頭布</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Score chips in nav */
    .score-chips {
      display: flex; gap: 0.4rem; flex-shrink: 0;
    }
    .score-chip {
      font-size: clamp(0.7rem, 2vw, 0.85rem);
      font-weight: 700;
      padding: 0.25rem 0.55rem;
      border-radius: 99px;
      white-space: nowrap;
    }
    .chip-w { background: rgba(5,150,105,0.12);  color: var(--green); }
    .chip-d { background: rgba(217,119,6,0.12);  color: var(--yellow); }
    .chip-l { background: rgba(220,38,38,0.08);  color: var(--red); }

    /* AI mode toggle */
    .ai-mode-row {
      display: flex; align-items: center; gap: 0.5rem;
      justify-content: center; flex-wrap: wrap;
    }
    .ai-mode-label {
      font-size: clamp(0.78rem, 2.2vw, 0.9rem);
      color: var(--dim);
    }
    .ai-toggle {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.3rem 0.85rem;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: clamp(0.78rem, 2.2vw, 0.9rem);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .ai-toggle:active { transform: scale(0.96); }
    .ai-toggle.strategy { background: rgba(124,58,237,0.1); border-color: #7c3aed; color: #7c3aed; }

    /* VS layout in result */
    .vs-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      font-size: clamp(2rem, 5vh, 2.8rem);
      width: 100%;
    }
    .vs-item { text-align: center; min-width: 0; }
    .vs-label {
      font-size: 0.42em;
      color: var(--dim);
      margin-top: 0.15em;
    }
    .vs-sep { font-size: 0.4em; color: var(--border); font-weight: 900; }

    #state-result {
      width: 100%;
    }

    /* Hint row */
    .hint-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body class="game-page">

  <nav class="top-nav">
    <a href="./" class="btn btn-back">← 返回</a>
    <h1>✊ 剪刀石頭布 AI 對戰</h1>
    <div class="score-chips">
      <span class="score-chip chip-w">勝&nbsp;<span id="w">0</span></span>
      <span class="score-chip chip-d">平&nbsp;<span id="d">0</span></span>
      <span class="score-chip chip-l">敗&nbsp;<span id="l">0</span></span>
    </div>
  </nav>

  <div class="game-body">

  <div class="camera-wrapper">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <!-- 手勢即時標籤 -->
    <div class="gesture-pill" id="gest-pill" style="display:none;"></div>

    <!-- 倒數計時大字 -->
    <div id="cd-overlay" style="
      display:none; position:absolute; inset:0; z-index:25;
      align-items:center; justify-content:center; flex-direction:column; gap:0.3rem;
      background:rgba(10,14,26,0.5);
    ">
      <div id="cd-num-big" style="font-size:clamp(5rem,18vw,9rem); font-weight:900; color:#fff; line-height:1;"></div>
      <div id="cd-label" style="font-size:clamp(1rem,3vw,1.5rem); color:#fcd34d; font-weight:700;"></div>
    </div>

    <!-- 鏡頭權限 / 載入狀態 overlay -->
    <div class="cam-permission" id="cam-perm">
      <!-- 初始畫面 -->
      <div id="perm-initial">
        <div class="icon">📷</div>
        <h3>需要鏡頭權限</h3>
        <p>遊戲需要使用前鏡頭來辨識你的手勢</p>
        <button class="btn btn-primary" style="margin-top:0.3rem;" onclick="startCamera()">開啟鏡頭</button>
      </div>
      <!-- 載入中畫面 -->
      <div id="perm-loading" style="display:none; flex-direction:column; align-items:center; gap:0.8rem;">
        <div class="spinner"></div>
        <p id="loading-msg" style="color:#94a3b8; font-size:0.9rem;">正在載入 AI 手勢辨識模型…</p>
        <p style="color:#64748b; font-size:0.75rem;">首次載入需要 5–15 秒，請稍候</p>
      </div>
    </div>
  </div>

  <div class="game-panel">

    <!-- WAITING -->
    <div id="state-waiting" style="display:flex; flex-direction:column; gap:0.75rem;">
      <div class="status-text">比出你的手勢</div>
      <div class="status-sub">
        ✊ 石頭　🖐 布　✌️ 剪刀
      </div>

      <!-- AI 模式切換 -->
      <div class="ai-mode-row">
        <span class="ai-mode-label">AI 模式：</span>
        <button class="ai-toggle" id="ai-mode-btn" onclick="toggleAiMode()">
          🎲 隨機
        </button>
      </div>

      <!-- 手部偵測狀態 -->
      <div class="hint-row">
        <div class="hand-status no-hand" id="hand-status-chip">
          <span id="hand-status-dot">⬤</span>
          <span id="hand-status-text">等待手勢…</span>
        </div>
      </div>

      <!-- 穩定度 progress bar -->
      <div id="stable-bar-section" style="display:none; gap:0.3rem; flex-direction:column;">
        <div style="font-size:0.78rem; color:var(--dim); text-align:center;" id="stable-bar-label">保持手勢不動…</div>
        <div class="stable-bar-wrap">
          <div class="stable-bar-fill" id="stable-bar-fill" style="width:0%;"></div>
        </div>
      </div>
    </div>

    <!-- RESULT -->
    <div id="state-result" style="display:none; flex-direction:column; gap:0.9rem; align-items:center;">
      <div class="result-badge" id="result-badge"></div>
      <div class="vs-row">
        <div class="vs-item">
          <div id="player-emoji"></div>
          <div class="vs-label">你</div>
        </div>
        <div class="vs-sep">VS</div>
        <div class="vs-item">
          <div id="ai-emoji"></div>
          <div class="vs-label">AI</div>
        </div>
      </div>
      <div style="font-size:0.85rem; color:var(--dim);" id="result-next-hint">3 秒後自動重新開始…</div>
    </div>

  </div>

  </div><!-- /.game-body -->

  <script type="module">
    import { HandLandmarker, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";

    // ── Constants ─────────────────────────────────────────────
    const BEATS      = { rock: 'scissors', scissors: 'paper', paper: 'rock' };
    const COUNTER    = { rock: 'paper',    paper: 'scissors', scissors: 'rock' };
    const AI_CHOICES = ['rock', 'paper', 'scissors'];
    const EMOJI      = { rock: '✊', paper: '🖐', scissors: '✌️' };
    const LABEL      = { rock: '石頭', paper: '布', scissors: '剪刀' };
    const STABLE_NEED    = 6;
    const COUNTDOWN_S    = 3;
    const NULL_TOLERANCE = 4;
    const HISTORY_WINDOW = 5;   // 策略 AI 分析的歷史視窗

    // ── AI 模式 ────────────────────────────────────────────────
    let aiMode        = 'random';  // 'random' | 'strategy'
    let playerHistory = [];        // 玩家出拳歷史（最多保留 10 筆）

    function randomMode() {
      return AI_CHOICES[Math.random() * 3 | 0];
    }

    /** 分析最近 HISTORY_WINDOW 次，找最常見手勢，出剋制拳。
     *  歷史不足或無明顯傾向時退回隨機。
     */
    function strategyMode(history) {
      const recent = history.slice(-HISTORY_WINDOW).filter(g => AI_CHOICES.includes(g));
      if (recent.length < HISTORY_WINDOW) return randomMode();

      // 統計各手勢出現次數
      const counts = {};
      for (const g of recent) counts[g] = (counts[g] || 0) + 1;
      const sorted  = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const topFreq = sorted[0][1];

      // 若全部平均（無明顯傾向），退回隨機
      if (topFreq <= 1) return randomMode();

      const predicted = sorted[0][0];
      return COUNTER[predicted];
    }

    function pickAI() {
      return aiMode === 'strategy' ? strategyMode(playerHistory) : randomMode();
    }

    window.toggleAiMode = function () {
      aiMode = aiMode === 'random' ? 'strategy' : 'random';
      const btn = document.getElementById('ai-mode-btn');
      if (aiMode === 'strategy') {
        btn.textContent = '🧠 策略';
        btn.className   = 'ai-toggle strategy';
      } else {
        btn.textContent = '🎲 隨機';
        btn.className   = 'ai-toggle';
      }
    };

    // MediaPipe hand connections (21 landmarks, 0–20)
    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],
      [0,17],
    ];

    // ── State ──────────────────────────────────────────────────
    let state = 'cam-perm';
    let score = { w: 0, d: 0, l: 0 };
    let gestureHistory = [];
    let lockedGesture  = null;
    let countdownStart = null;
    let stableCount    = 0;
    let nullFrameCount = 0;

    // Hand detection state（瀏覽器端 MediaPipe）
    let handLandmarker = null;
    let modelReady     = false;
    let lastVideoTime  = -1;
    let curGesture     = null;    // latest gesture string
    let curLandmarks   = [];      // latest [{x,y,z}]

    /** 手勢分類（與 rps_game.py 相同：指尖 y < 第二關節 y 視為伸直）。 */
    function classifyGesture(lm) {
      const up = (tip, pip) => lm[tip].y < lm[pip].y;
      const i = up(8, 6), m = up(12, 10), r = up(16, 14), p = up(20, 18);
      const count = [i, m, r, p].filter(Boolean).length;
      if (count === 0) return 'rock';
      if (count >= 3)  return 'paper';
      if (i && m && !r && !p) return 'scissors';
      return null;
    }

    async function initHands() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm"
      );
      const baseOptions = {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      };
      const options = {
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.6,
        minHandPresenceConfidence:  0.6,
        minTrackingConfidence:      0.5,
      };
      try {
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          ...options, baseOptions: { ...baseOptions, delegate: "GPU" },
        });
      } catch (_) {
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          ...options, baseOptions: { ...baseOptions, delegate: "CPU" },
        });
      }
      modelReady = true;
    }

    function detectHands() {
      if (!handLandmarker || !video.videoWidth) return;
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;
      const result = handLandmarker.detectForVideo(video, performance.now());
      if (!result.landmarks || result.landmarks.length === 0) {
        curGesture = null; curLandmarks = [];
        return;
      }
      curLandmarks = result.landmarks[0];
      curGesture   = classifyGesture(curLandmarks);
    }

    // ── Stable gesture ─────────────────────────────────────────
    function stableGesture(raw) {
      if (!raw) {
        nullFrameCount++;
        if (nullFrameCount > NULL_TOLERANCE) {
          gestureHistory = [];
          stableCount = 0;
        }
        return null;
      }
      nullFrameCount = 0;
      gestureHistory.push(raw);
      if (gestureHistory.length > STABLE_NEED) gestureHistory.shift();
      if (gestureHistory.length < STABLE_NEED) {
        stableCount = gestureHistory.filter(g => g === raw).length;
        return null;
      }
      const first   = gestureHistory[0];
      const allSame = gestureHistory.every(g => g === first);
      stableCount   = allSame ? STABLE_NEED : gestureHistory.filter(g => g === raw).length;
      return allSame ? first : null;
    }

    // ── DOM refs ──────────────────────────────────────────────
    const video          = document.getElementById('video');
    const canvas         = document.getElementById('canvas');
    const ctx            = canvas.getContext('2d');
    const gestPill       = document.getElementById('gest-pill');
    const cdOverlay      = document.getElementById('cd-overlay');
    const cdNumBig       = document.getElementById('cd-num-big');
    const cdLabel        = document.getElementById('cd-label');
    const handChip       = document.getElementById('hand-status-chip');
    const handTxt        = document.getElementById('hand-status-text');
    const stableSection  = document.getElementById('stable-bar-section');
    const stableBarFill  = document.getElementById('stable-bar-fill');
    const stableBarLabel = document.getElementById('stable-bar-label');

    function resizeCanvas() {
      const w = video.videoWidth  || video.offsetWidth;
      const h = video.videoHeight || video.offsetHeight;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w; canvas.height = h;
      }
    }

    // ── Skeleton drawing ───────────────────────────────────────
    function drawSkeleton(lms) {
      ctx.save();
      ctx.scale(-1, 1);
      ctx.translate(-canvas.width, 0);

      ctx.strokeStyle = 'rgba(147,197,253,0.7)';
      ctx.lineWidth   = 2.5;
      for (const [s, e] of HAND_CONNECTIONS) {
        ctx.beginPath();
        ctx.moveTo(lms[s].x * canvas.width, lms[s].y * canvas.height);
        ctx.lineTo(lms[e].x * canvas.width, lms[e].y * canvas.height);
        ctx.stroke();
      }
      for (const lm of lms) {
        ctx.beginPath();
        ctx.arc(lm.x * canvas.width, lm.y * canvas.height, 5, 0, Math.PI * 2);
        ctx.fillStyle   = '#fcd34d';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth   = 1.5;
        ctx.stroke();
      }
      ctx.restore();
    }

    // ── State machine ──────────────────────────────────────────
    function setState(s) {
      state = s;
      document.getElementById('state-waiting').style.display = s === 'waiting' ? 'flex' : 'none';
      document.getElementById('state-result').style.display  = s === 'result'  ? 'flex' : 'none';
      cdOverlay.style.display = s === 'countdown' ? 'flex' : 'none';
      if (s === 'waiting') {
        gestureHistory = [];
        stableCount    = 0;
        nullFrameCount = 0;
        updateHandStatusUI(null, null);
      }
    }

    function determine(p, a) {
      if (p === a) return 'draw';
      return BEATS[p] === a ? 'win' : 'lose';
    }

    function showResult(pg, ag) {
      // 記錄玩家出拳歷史（策略 AI 使用）
      if (pg) {
        playerHistory.push(pg);
        if (playerHistory.length > 10) playerHistory.shift();
      }
      const res   = determine(pg, ag);
      const badge = document.getElementById('result-badge');
      badge.textContent = res === 'win' ? '🏆 WIN！' : res === 'lose' ? '😅 LOSE' : '🤝 DRAW';
      badge.className   = `result-badge result-${res}`;
      document.getElementById('player-emoji').textContent = EMOJI[pg];
      document.getElementById('ai-emoji').textContent     = EMOJI[ag];
      score.w += res === 'win'  ? 1 : 0;
      score.l += res === 'lose' ? 1 : 0;
      score.d += res === 'draw' ? 1 : 0;
      document.getElementById('w').textContent = score.w;
      document.getElementById('d').textContent = score.d;
      document.getElementById('l').textContent = score.l;
      setState('result');

      const hint = document.getElementById('result-next-hint');
      let secs = 3;
      hint.textContent = `${secs} 秒後自動重新開始…`;
      const timer = setInterval(() => {
        secs--;
        hint.textContent = secs > 0 ? `${secs} 秒後自動重新開始…` : '準備中…';
        if (secs <= 0) clearInterval(timer);
      }, 1000);

      setTimeout(() => {
        lockedGesture  = null;
        gestureHistory = [];
        stableCount    = 0;
        setState('waiting');
      }, 3200);
    }

    // ── Hand-status UI ─────────────────────────────────────────
    function updateHandStatusUI(hasHand, rawGest) {
      if (!hasHand) {
        handChip.className  = 'hand-status no-hand';
        handTxt.textContent = modelReady ? '未偵測到手，請把手放到鏡頭前' : '模型載入中…';
        stableSection.style.display = 'none';
        gestPill.style.display      = 'none';
        return;
      }
      if (!rawGest) {
        handChip.className  = 'hand-status detecting';
        handTxt.textContent = '偵測到手，請比出石頭 / 布 / 剪刀';
        stableSection.style.display = 'none';
        gestPill.style.display      = 'none';
        return;
      }
      const pct = Math.min(100, (gestureHistory.filter(g => g === rawGest).length / STABLE_NEED) * 100);
      handChip.className      = 'hand-status detecting';
      handTxt.textContent     = `偵測到「${LABEL[rawGest]}」，保持不動…`;
      stableSection.style.display = 'flex';
      stableBarFill.style.width   = pct + '%';
      stableBarLabel.textContent  = `穩定度 ${Math.round(pct)}%（${STABLE_NEED} 幀確認）`;
      gestPill.textContent    = LABEL[rawGest];
      gestPill.style.display  = 'block';
    }

    // ── FPS counter ────────────────────────────────────────────
    let fpsLastTime = 0;
    let fpsCount    = 0;
    let fpsDisplay  = 0;

    // ── Render loop (rAF — UI only, no MediaPipe here) ─────────
    function renderLoop() {
      requestAnimationFrame(renderLoop);
      if (!video.videoWidth) return;

      detectHands();
      resizeCanvas();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const now = performance.now();
      fpsCount++;
      if (now - fpsLastTime >= 1000) {
        fpsDisplay  = fpsCount;
        fpsCount    = 0;
        fpsLastTime = now;
      }

      const hasHand = curLandmarks.length > 0;
      if (hasHand) drawSkeleton(curLandmarks);

      // Debug overlay
      if (state === 'waiting' || state === 'countdown') {
        ctx.save();
        ctx.font      = 'bold 13px monospace';
        ctx.fillStyle = hasHand ? 'rgba(52,211,153,0.9)' : 'rgba(248,113,113,0.9)';
        ctx.fillText(`FPS:${fpsDisplay}  ${hasHand ? '✋偵測到' : '✋未偵測'}`, 8, 20);
        ctx.restore();
      }

      const stable = stableGesture(curGesture);

      if (state === 'waiting') {
        updateHandStatusUI(hasHand, curGesture);
        if (stable) {
          lockedGesture  = stable;
          countdownStart = performance.now();
          stableSection.style.display = 'none';
          gestPill.style.display      = 'none';
          setState('countdown');
        }
      } else {
        gestPill.style.display = 'none';
      }

      if (state === 'countdown') {
        const elapsed = (performance.now() - countdownStart) / 1000;
        const remain  = COUNTDOWN_S - elapsed;
        cdLabel.textContent = `你出「${LABEL[lockedGesture]}」`;
        if (remain > 0) {
          cdNumBig.textContent = Math.ceil(remain);
        } else {
          cdNumBig.textContent = '出！';
          const ag = pickAI();
          countdownStart = null;
          setState('result');
          setTimeout(() => showResult(lockedGesture, ag), 200);
        }
      }
    }

    // ── Camera startup ─────────────────────────────────────────
    window.startCamera = async function () {
      document.getElementById('perm-initial').style.display = 'none';
      document.getElementById('perm-loading').style.display = 'flex';
      document.getElementById('loading-msg').textContent    = '正在開啟鏡頭…';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();

        document.getElementById('loading-msg').textContent = '正在載入 AI 手勢辨識模型…';
        await initHands();

        document.getElementById('cam-perm').style.display = 'none';
        setState('waiting');

        requestAnimationFrame(renderLoop);

      } catch (e) {
        document.getElementById('perm-loading').style.display = 'none';
        document.getElementById('perm-initial').style.display = 'flex';
        document.getElementById('perm-initial').querySelector('p').textContent =
          '❌ ' + e.message + '。請允許鏡頭權限（需在 HTTPS 網址下使用）。';
        document.getElementById('cam-perm').style.display = 'flex';
      }
    };

    window.addEventListener('load', () => startCamera());
  </script>
</body>
</html>
